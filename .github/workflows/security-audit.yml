name: Security Audit

on:
  schedule:
    - cron: '0 9 1 * *'   # 매월 1일 09:00 UTC 자동 실행
  push:
    branches: [main, feat/phase1-mvp]
  pull_request:
    branches: [main, feat/phase1-mvp]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 아래 배포격차 검사가 이전 커밋과 diff해야 해서 전체 히스토리 필요

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # [2026-08-20 신설, 실사고 근거] 이 세션에서 hooks/ 안전 수정 18건 이상이 커밋도 안 된 채
      # 7일간 실제 설치된 플러그인엔 하나도 반영 안 되고 있었음을 뒤늦게 발견했다(CHECKPOINT §BK).
      # 근본 원인 중 하나: `claude plugin update`는 .claude-plugin/plugin.json의 버전 번호로만
      # 갱신 여부를 판단해서, hooks/*.mjs를 고쳐도 버전을 안 올리면 배포 자체가 안 일어난다.
      # 사람의 기억에 맡기지 않고 CI가 강제하게 만든다 — hooks/ 변경 + 버전 미변경 조합이면 실패.
      - name: hooks 변경 시 plugin.json 버전범프 확인 (배포 격차 재발 방지)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # 브랜치 최초 push 등으로 비교 대상 커밋이 없으면(전부 0) 검사할 게 없으니 건너뜀
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "비교 대상 커밋 없음(최초 push 등) — 건너뜀"
            exit 0
          fi
          HOOKS_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- hooks/ | wc -l)
          VERSION_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- .claude-plugin/plugin.json | wc -l)
          if [ "$HOOKS_CHANGED" -gt 0 ] && [ "$VERSION_CHANGED" -eq 0 ]; then
            echo "오류: hooks/ 를 고쳤는데 .claude-plugin/plugin.json 버전을 안 올렸습니다."
            echo "claude plugin update 는 버전 번호로만 갱신 여부를 판단해서, 버전을 안 올리면"
            echo "실제 설치된 플러그인엔 이 수정이 절대 반영되지 않습니다."
            echo "(2026-08-20 실제 사고: 안전 수정 18건 이상이 7일간 미배포로 방치됨)"
            echo ""
            echo "바뀐 hooks 파일:"
            git diff --name-only "$BASE" "$HEAD" -- hooks/
            exit 1
          fi
          echo "OK — hooks 변경 없음 또는 버전범프 확인됨"

      - name: npm audit (고위험 차단)
        run: npm audit --audit-level=high

      - name: 외부 의존성 0 검증 (dependencies 비어있어야 함)
        run: |
          DEPS=$(node -e "const p=require('./package.json'); console.log(Object.keys(p.dependencies||{}).length)")
          if [ "$DEPS" != "0" ]; then
            echo "오류: dependencies에 외부 패키지가 있습니다 (PRD §8.6 위반)"
            exit 1
          fi

      - name: 금지 패턴 스캔 (eval·new Function·fetch·child_process)
        run: |
          # 정규식 .exec() 같은 무해한 호출은 제외하고 동적 실행·프로세스 생성·네트워크만 정밀 탐지.
          # (exec 위험은 child_process import를 통하므로 child_process 매칭으로 커버됨)
          # [2026-08-02, 정밀화] "AUDIT-ALLOW" 표식이 붙은 줄만 예외 — 완화가 아니라 정밀화:
          # 이 표식이 없는 다른 모든 줄(현재·향후 어떤 파일이든)은 여전히 100% 차단된다.
          # 현재 유일한 사용처: hooks/guard.mjs의 U3(git commit 시 스테이징 파일명 검사) —
          # 고정 인자만 쓰는 읽기전용 git 진단 호출, AI가 만든 텍스트는 섞이지 않음(코드 주석 참고).
          if grep -rnE "\beval[[:space:]]*\(|\bnew[[:space:]]+Function[[:space:]]*\(|\bchild_process\b|\bfetch[[:space:]]*\(" hooks/ --include="*.mjs" \
            | grep -v "_selftest" | grep -v "AUDIT-ALLOW"; then
            echo "오류: hooks/ 에 금지 패턴이 발견됐습니다"
            exit 1
          fi

      - name: 비밀값 하드코딩 스캔
        run: |
          if grep -rn "token\s*=\s*['\"][A-Za-z0-9]\|password\s*=\s*['\"][A-Za-z0-9]\|api_key\s*=\s*['\"]" hooks/ --include="*.mjs"; then
            echo "오류: 하드코딩된 비밀값 패턴이 발견됐습니다"
            exit 1
          fi

  # 저장소가 "테스트 통과"를 스스로 증명 (E-1 재현성): _selftest.mjs를 실제 실행해 0 FAIL 확인.
  # 개수는 플랫폼 의존(Windows 기준 114) → CI는 숫자가 아닌 exit 0(0 FAIL)로만 검증.
  # Windows·Linux(ubuntu) 양쪽 실행 (fix/posix-backup-portability에서 이식성 버그 2건 수정 후 ubuntu 추가):
  #   ① writeDestinations가 POSIX 절대경로(/abs) cp/mv 대상을 스킵하던 문제 → guard.mjs를 WIN 인지 규칙으로 수정
  #   ② `/c/Windows` 민감판정(Git Bash 마운트·Windows 전용) → _selftest.mjs를 플랫폼별 경로(posix=/etc)로 수정
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: guard 자가 테스트 (node hooks/_selftest.mjs → 0 FAIL)
        run: node hooks/_selftest.mjs
